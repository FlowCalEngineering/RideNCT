<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test voix légère</title>
<style>body{font:15px -apple-system,Helvetica,sans-serif;margin:0;padding:16px;background:#1c1c1e;color:#fff}h1{font-size:18px}button{display:block;width:100%;margin:8px 0;padding:14px;font-size:15px;font-weight:700;border:0;border-radius:10px;background:#ff6a1a;color:#fff}button.g{background:#48484a}textarea{width:100%;box-sizing:border-box;font-size:15px;padding:8px;border-radius:8px}pre{white-space:pre-wrap;background:#000;padding:10px;border-radius:8px;font-size:12px;max-height:40vh;overflow:auto}small{color:#aaa}</style></head><body>
<h1>Test voix légère (eSpeak) et lecture</h1>
<small>Lance d'abord ta musique (Apple Musique / Spotify), puis appuie sur les boutons. Dis-moi pour chacun : la musique baisse ? coupe ? reprend ? et la qualité de la voix.</small>
<textarea id="t" rows="2">Dans trois cents mètres, tournez à droite sur la rue des Lilas</textarea>
<button id="load">0. Charger le moteur eSpeak</button>
<button id="a1" class="g">1. Lecteur audio + session « transient »</button>
<button id="a2" class="g">2. AudioContext (session par défaut)</button>
<button id="a3" class="g">3. AudioContext + session « transient »</button>
<button id="a4" class="g">4. AudioContext + session « ambient »</button>
<button id="a5" class="g">5. Voix de l'iPhone (référence)</button>
<pre id="log">…</pre>
<script>
const L=document.getElementById('log'),log=m=>{L.textContent=new Date().toTimeString().slice(0,8)+' '+m+'\n'+L.textContent};
let wav=null,ctx=null;
const BASES=['https://cdn.jsdelivr.net/npm/mespeak@2.0.2/docs/','https://cdn.jsdelivr.net/npm/mespeak@2.0.2/','https://cdn.jsdelivr.net/npm/mespeak@2.0.2/src/'];
const VOICES=['voices/fr.json','voices/fr/fr.json','fr.json'];
const ok=async u=>{try{const r=await fetch(u);return r.ok}catch(e){return false}};
const addScript=u=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>rej(new Error('script '+u));document.head.appendChild(s)});
document.getElementById('load').onclick=async()=>{
 try{
  let base=null;for(const b of BASES){for(const f of ['mespeak.js']){if(await ok(b+f)){base=b;break}}if(base)break}
  if(!base)return log('mespeak.js introuvable sur les 3 emplacements');
  log('moteur : '+base);await addScript(base+'mespeak.js');
  await new Promise((res,rej)=>meSpeak.loadConfig(base+'mespeak_config.json',(s)=>s?res():rej(new Error('config'))));
  log('config ok');
  let v=null;for(const f of VOICES){if(await ok(base+f)){v=f;break}}
  if(!v)return log('voix fr introuvable ('+VOICES.join(', ')+')');
  await new Promise((res,rej)=>meSpeak.loadVoice(base+v,(s,e)=>s?res():rej(new Error('voix '+e))));
  log('voix fr ok : '+v);
  await synth();
 }catch(e){log('ERREUR '+e.message)}
};
async function synth(){
 const t0=performance.now();const arr=meSpeak.speak(document.getElementById('t').value,{rawdata:'array',voice:'fr',speed:165,pitch:45,amplitude:100});
 if(!arr||!arr.length)throw new Error('synthèse vide');wav=new Uint8Array(arr);log('synthèse '+Math.round(performance.now()-t0)+' ms · '+Math.round(wav.length/1024)+' Ko');
}
const type=t=>{try{if(navigator.audioSession){navigator.audioSession.type=t;log('session : '+navigator.audioSession.type)}else log('pas d\'audioSession')}catch(e){log('session KO '+e.message)}};
async function need(){if(!window.meSpeak)throw new Error('charge d\'abord le moteur (0)');await synth()}
document.getElementById('a1').onclick=async()=>{try{await need();type('transient');const a=new Audio(URL.createObjectURL(new Blob([wav],{type:'audio/wav'})));a.onended=()=>{type('ambient');log('fin')};await a.play();log('lecture <audio>')}catch(e){log('ERREUR '+e.message)}};
async function webaudio(t){try{await need();if(t)type(t);ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();const b=await ctx.decodeAudioData(wav.buffer.slice(0));const s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.onended=()=>log('fin');s.start();log('lecture AudioContext '+b.duration.toFixed(1)+' s')}catch(e){log('ERREUR '+e.message)}}
document.getElementById('a2').onclick=()=>webaudio(null);
document.getElementById('a3').onclick=()=>webaudio('transient');
document.getElementById('a4').onclick=()=>webaudio('ambient');
document.getElementById('a5').onclick=()=>{const u=new SpeechSynthesisUtterance(document.getElementById('t').value);u.lang='fr-FR';u.onend=()=>log('fin');speechSynthesis.speak(u);log('voix iPhone')};
</script></body></html>
