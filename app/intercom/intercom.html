        <section id="view-intercom" class="module-view">
            <h1 class="module-header">Intercom</h1>
            

            <!-- ONGLET 1 : RADAR (Création, Rencontre & Canaux proches) -->
            <div id="sub-intercom-radar" class="intercom-sub-view active">
                
                <!-- Mosaïque Intercom -->
                <button id="btn-show-create-hud" class="mz-ban" style="margin-bottom: 9px;">
                    <span class="mz-ic"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></span>
                    <span><b>Créer un canal</b><small>Parler en roulant</small></span>
                </button>
                <div class="mz" style="margin-bottom: 9px;">
                    <button id="btn-scan-qr" class="mz-t" style="min-height: 150px;">
                        <span class="mz-ic c4 top"><svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M7 12h10"></path></svg></span>
                        <b>Scanner un QR</b><small>Rejoindre un canal</small>
                    </button>
                    <div class="mz-t" style="min-height: 150px;">
                        <span class="mz-ic c1 top"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
                        <b>Mode auto</b><small id="intercom-auto-status">Désactivé</small>
                        <button id="intercom-toggle-auto" class="radar-switch" aria-label="Activer mode auto" style="margin-top: 8px;"></button>
                    </div>
                </div>
                <div class="mz-t" data-no-swipe style="flex-direction: row; align-items: center; gap: 10px; padding: 12px 14px; margin-bottom: 9px; flex-shrink: 0; cursor: default;">
                    <span style="display: flex; color: var(--text-muted);"><svg class="vi" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></span>
                    <input type="range" id="ic-voice-vol-auto" min="0" max="100" value="100" class="vol-slider" aria-label="Volume des motards">
                    <span id="ic-voice-vol-auto-val" style="width: 42px; text-align: right; font-size: 0.8rem; font-weight: 800; color: var(--text-main);">100%</span>
                </div>
                <div id="intercom-auto-participants" style="display: none; flex-wrap: wrap; gap: 10px; margin-bottom: 9px; justify-content: center;"></div>

                <button id="btn-ic-invitations" class="mz-row" style="margin-bottom: 9px;">
                    <span class="mz-ic c3"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 6L2 7"></path></svg></span>
                    <div><b>Invitations</b><small>Rejoindre un groupe</small></div>
                    <svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"></path></svg>
                </button>

                <!-- Liste des Canaux à proximité -->
                <div class="card" style="flex: none;">
                    <h2 style="font-size: 1rem; font-style: italic; margin-bottom: 10px;">Canaux à proximité</h2>
                    <div id="intercom-active-rooms-list" style="display: flex; flex-direction: column;">
                        <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 20px 10px;">Recherche en cours...</div>
                    </div>
                </div>
            </div>

            <!-- ONGLET 2 : INVITATIONS REÇUES -->
            <div id="sub-intercom-invites" class="intercom-sub-view">
                <button id="btn-ic-back" class="mz-row" style="margin-bottom: 9px;"><span class="mz-ic"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg></span><div><b>Retour</b></div></button>
                <div class="card">
                    <h2 style="font-size: 1.1rem; margin-bottom: 10px;">Invitations reçues</h2>
                    <div id="intercom-received-invites-list" style="display: flex; flex-direction: column;">
                        <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 20px 10px;">Aucune invitation en attente.</div>
                    </div>
                </div>
            </div>

            <!-- INTERFACE D'APPEL ACTIF -->
            <!-- INTERFACE D'APPEL ACTIF (Design Modernisé) -->
            <div id="intercom-active-call" style="display: none; flex-direction: column; flex: 1; animation: fadeIn 0.3s ease-out;">
                
                <!-- En-tête Call -->
                <div class="ic-hd">
                    <div class="ic-hd-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01"></path><path d="M7 20v-4"></path><path d="M12 20v-8"></path><path d="M17 20V8"></path><path d="M22 4v16"></path></svg></div>
                    <div class="ic-hd-txt">
                        <div class="ic-hd-name"><span id="active-call-name">Nom du Canal</span><span id="active-call-privacy-badge"></span></div>
                        <div id="active-call-desc">Connexion mains libres activée</div>
                    </div>
                    <button class="ic-sq" id="btn-hud-code" style="display:none;" aria-label="Partager le code du canal"><svg class="vi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
                    <button class="ic-sq" id="btn-hud-invite" aria-label="Inviter"><svg class="vi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg></button>
                    <button class="ic-sq" id="ic-mic-settings-btn" aria-label="Réglages du micro"><svg class="vi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></button>
                </div>

                <div class="ic-parts" data-no-swipe><div id="active-call-participants"></div></div>

                <!-- 🔊 Volumes de l'appel : voix des motards + musique partagée -->
                <div id="ic-volumes" data-no-swipe style="flex-shrink: 0; background: rgba(var(--tint),0.04); border: 1px solid rgba(var(--tint),0.06); border-radius: 16px; padding: 12px 14px; margin-top: 8px; margin-bottom: 10px;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span style="width: 26px; display: flex; justify-content: center; color: var(--text-muted); flex-shrink: 0;"><svg class="vi" viewBox="0 0 24 24" style="width:20px;height:20px;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
                        <div style="flex: 1; min-width: 0;">
                            <div style="font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;">Volume des motards</div>
                            <input type="range" id="ic-voice-vol" min="0" max="100" value="100" class="vol-slider" aria-label="Volume général des motards">
                        </div>
                        <span id="ic-voice-vol-val" style="width: 42px; text-align: right; font-size: 0.8rem; font-weight: 800; color: var(--text-main); font-variant-numeric: tabular-nums;">100%</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; margin-top: 12px;">
                        <span style="width: 26px; display: flex; justify-content: center; color: var(--text-muted); flex-shrink: 0;"><svg class="vi" viewBox="0 0 24 24" style="width:20px;height:20px;"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
                        <div style="flex: 1; min-width: 0;">
                            <div style="font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;">Volume de la musique</div>
                            <input type="range" id="ic-music-vol" min="0" max="100" value="80" class="vol-slider" aria-label="Volume de la musique partagée">
                        </div>
                        <span id="ic-music-vol-val" style="width: 42px; text-align: right; font-size: 0.8rem; font-weight: 800; color: var(--text-main); font-variant-numeric: tabular-nums;">80%</span>
                    </div>
                </div>

                <!-- 🎵 Partage de musique dans le canal -->
                <div id="ic-music-card" style="flex-shrink: 0; margin-top: 8px;">
                    <div id="ic-music-now" style="display: none; background: rgba(10,132,255,0.12); border: 1px solid rgba(10,132,255,0.3); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <div style="display: flex; color: #0a84ff;"><svg class="vi" viewBox="0 0 24 24" style="width:26px;height:26px;"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg></div>
                            <div style="flex: 1; min-width: 0;">
                                <div id="ic-music-now-who" style="font-size: 0.7rem; font-weight: 800; color: #0a84ff; text-transform: uppercase; letter-spacing: 1px;"></div>
                                <div id="ic-music-now-title" style="font-size: 0.95rem; font-weight: 900; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>
                                <div id="ic-music-now-artist" style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>
                            </div>
                            <button id="ic-music-listen" class="btn" style="width: auto; padding: 10px 14px; border-radius: 12px; font-size: 0.75rem; font-weight: 800; background: rgba(128,128,128,0.2); color: var(--text-main); display: flex; align-items: center;"><svg class="vi" viewBox="0 0 24 24" style="width:18px;height:18px;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
                        </div>
                    </div>
                    <div id="ic-music-self" style="display: none; background: rgba(48,209,88,0.12); border: 1px solid rgba(48,209,88,0.3); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px;">
                        <div style="font-size: 0.7rem; font-weight: 800; color: #30d158; text-transform: uppercase; letter-spacing: 1px;">Tu partages ta musique</div>
                        <div id="ic-music-self-title" style="font-size: 0.95rem; font-weight: 900; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;">Aucun titre en cours</div>
                        <div id="ic-music-self-artist" style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>
                        <div data-no-swipe style="display: flex; justify-content: center; gap: 14px; margin-top: 10px;">
                            <button class="btn" id="ic-music-prev" style="width: 52px; padding: 12px 0; border-radius: 14px; background: rgba(128,128,128,0.2); color: var(--text-main); display: flex; align-items: center; justify-content: center;" aria-label="Précédent"><svg class="vi" viewBox="0 0 24 24" style="width:20px;height:20px;"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>
                            <button class="btn" id="ic-music-play" style="width: 70px; padding: 12px 0; border-radius: 14px; background: var(--accent-color); color: var(--on-accent); display: flex; align-items: center; justify-content: center;" aria-label="Lecture / Pause"><svg class="vi" viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor;"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
                            <button class="btn" id="ic-music-next" style="width: 52px; padding: 12px 0; border-radius: 14px; background: rgba(128,128,128,0.2); color: var(--text-main); display: flex; align-items: center; justify-content: center;" aria-label="Suivant"><svg class="vi" viewBox="0 0 24 24" style="width:20px;height:20px;"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
                        </div>
                    </div>
                    <button id="ic-qm-btn" class="ic-alert"><svg class="vi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg> Alertes &amp; messages</button>
                    <div class="ic-duo">
                        <button id="ic-music-share-btn" class="ic-tile"><svg class="vi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg> Partager ma musique</button>
                        <button id="ic-route-share-btn" class="ic-tile"><svg class="vi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg> Partager un itinéraire</button>
                    </div>
                </div>

                <div class="ic-bar">
                    <button id="btn-toggle-mic" class="mic-toggle-btn mic-on">
                        <svg id="icon-mic-on" viewBox="0 0 24 24" style="width: 22px; height: 22px; fill: currentColor;"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2" fill="none" stroke="currentColor" stroke-width="2"></path></svg>
                        <svg id="icon-mic-off" viewBox="0 0 24 24" style="width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.5; display: none;"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23M12 19v4M8 23h8"></path></svg>
                        <span id="text-mic-status">Micro actif</span>
                    </button>
                    <button class="btn btn-danger ic-hang" id="btn-leave-room">Raccrocher</button>
                </div>
            </div>
            <div class="intercom-top-nav" id="intercom-nav-bar">
                <button class="intercom-tab-btn active" data-sub="sub-intercom-radar" title="Radar" aria-label="Radar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"></circle><path d="M16.2 7.8a6 6 0 0 1 0 8.4"></path><path d="M7.8 16.2a6 6 0 0 1 0-8.4"></path><path d="M19 5a10 10 0 0 1 0 14"></path><path d="M5 19A10 10 0 0 1 5 5"></path></svg></button>
                <button class="intercom-tab-btn" data-sub="sub-intercom-invites" title="Invitations" aria-label="Invitations"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 6L2 7"></path></svg></button>
            </div>
        </section>
