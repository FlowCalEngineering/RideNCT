                    <!-- 🟢 HUD TURN-BY-TURN : Format compact (Max 5-10% de l'écran) -->

                    </div>

                    <!-- 📊 BARRE DE TRAJET (visible pendant le suivi) -->
                    <div id="nav-trip-bar" class="nav-trip">
                <div class="nt-cell nt-route" title="Arrivée"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><b id="nt-eta">--:--</b></div>

                <div class="nt-cell nt-speedw" title="Compteur">

                    <div id="poi-filters" class="poi-filters">

                        <button class="poi-chip drink" data-cat="drink" title="Cafés et bars" aria-label="Cafés et bars"><svg viewBox="0 0 24 24"><path d="M17 8h1a4 4 0 1 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"></path><path d="M6 2v2"></path><path d="M10 2v2"></path><path d="M14 2v2"></path></svg></button>

                        <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>
                    </button>

                    <div class="sheet-content" id="sheet-content-area">

                            </div>
                        </div>
                        
                        <button id="btn-add-waypoint" class="btn" style="background: rgba(var(--tint),0.05); font-size: 0.9rem; font-weight: 700; padding: 18px; border-radius: 14px; margin-bottom: 20px;">+ Ajouter étape</button>
                        
                        <div style="display: flex; gap: 10px; flex-shrink: 0; margin-bottom: 20px;">
                            <button class="btn route-mode-btn active" data-mode="sinueux" style="flex: 1; padding: 14px 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 0.8rem; font-weight: 800; background: var(--accent-color); color: var(--on-accent); border-radius: 14px;">
                                <svg viewBox="0 0 24 24" style="width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M6 22 C 6 13, 16 15, 16 9 C 16 5, 12 3, 9 2"></path><path d="M14 22 C 14 15, 22 17, 22 9 C 22 4, 17 1, 15 2"></path><path d="M10 22 C 10 14, 19 16, 19 9 C 19 4.5, 14.5 2, 12 2" stroke-dasharray="3 4"></path></svg>
                                <span>Sinueux</span>
                            </button>
                            <button class="btn route-mode-btn" data-mode="sans-axe" style="flex: 1; padding: 14px 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 0.8rem; font-weight: 800; background: rgba(var(--tint),0.1); color: var(--text-main); border-radius: 14px;">
                                <svg viewBox="0 0 24 24" style="width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M4 22L9 2"></path><path d="M20 22L15 2"></path><line x1="12" y1="22" x2="12" y2="18"></line><line x1="12" y1="13" x2="12" y2="9"></line><line x1="12" y1="4" x2="12" y2="2"></line><line x1="3" y1="21" x2="21" y2="3" stroke-width="2.5"></line></svg>
                                <span>Sans Axes</span>
                            </button>
                            <button class="btn route-mode-btn" data-mode="rapide" style="flex: 1; padding: 14px 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 0.8rem; font-weight: 800; background: rgba(var(--tint),0.1); color: var(--text-main); border-radius: 14px;">
                                <svg viewBox="0 0 24 24" style="width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M4 22L9 2"></path><path d="M20 22L15 2"></path><line x1="12" y1="22" x2="12" y2="18"></line><line x1="12" y1="13" x2="12" y2="9"></line><line x1="12" y1="4" x2="12" y2="2"></line></svg>
                                <span>Rapide</span>
                            </button>
                        </div>

                        <div id="route-actions" class="action-row" style="margin-top: auto; padding-top: 15px; flex-wrap: wrap;">

                            <button id="btn-offline-route" class="pill-action-btn" style="background: rgba(var(--tint),0.1); color: var(--text-main);"><svg viewBox="0 0 24 24"><path d="M12 3v12"></path><polyline points="7 11 12 16 17 11"></polyline><path d="M5 20h14"></path></svg><span>Hors ligne</span></button>
                            <button id="btn-start-create" class="pill-action-btn" style="background: var(--accent-color); color: var(--on-accent);"><svg viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg><span>Démarrer</span></button>
                        </div>
                    </div>
                </div>

                            <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
