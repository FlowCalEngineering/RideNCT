<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test voix</title>
<style>body{font:15px -apple-system,sans-serif;background:#111;color:#eee;margin:0;padding:16px}button{font:600 17px inherit;padding:14px;width:100%;margin:8px 0;border-radius:12px;border:0;background:#e8541a;color:#fff}pre{white-space:pre-wrap;background:#000;padding:10px;border-radius:8px;font-size:13px}</style></head><body>
<p>Lance Apple Music, puis touche le bouton.</p>
<button id="b">Dire « Dans 300 mètres, tournez à gauche »</button>
<button id="c">Voix iPhone (comparaison)</button>
<pre id="o"></pre>
<script>
const o=document.getElementById('o'),L=m=>{o.textContent+=m+'\n'};
const ModuleGPS={vlog(e,t){L('['+e+'] '+t)}};
window.onerror=(m)=>L('ERREUR '+m);
</script>
<script src="route/voix-clips.js"></script>
<script>
L('audioSession : '+(navigator.audioSession?'oui':'NON'));
L('manifeste : '+document.baseURI);
ModuleTTS.load().then(m=>L('clips au manifeste : '+Object.keys(m).length));
b.onclick=async()=>{
  const t='Dans 300 mètres, tournez à gauche sur la rue X';
  L('---');L('a: '+(ModuleTTS.has(t)));
  const k=ModuleTTS.parse(t);L('clés : '+JSON.stringify(k));
  if(!k){L('texte non composable');return}
  const u=await Promise.all(k.map(x=>ModuleTTS.fetchClip(x)));L('clips chargés : '+u.map(x=>x?'ok':'NON').join(','));
  const t0=Date.now();const r=await ModuleTTS.speak({text:t});L('résultat : '+r+' ('+(Date.now()-t0)+' ms) ; session='+(navigator.audioSession&&navigator.audioSession.type));
};
c.onclick=()=>{const u=new SpeechSynthesisUtterance('Dans trois cents mètres, tournez à gauche');u.lang='fr-FR';u.onend=()=>L('voix iPhone : fin');speechSynthesis.speak(u);L('voix iPhone : dit')};
</script></body></html>
