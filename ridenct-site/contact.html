<body data-page="contact">
<a class="skip" href="#main">Aller au contenu</a>
<div id="site-header"></div>
<main id="main">
<div class="wrap page-title"><p class="eyebrow">Contact</p><h1>Écris-<span>nous</span></h1><p>Une idée, un bug, une envie de rouler avec nous ? Écris-nous, on lit tout et on répond vite. Tu veux être prévenu au départ de l'app ? Dis-le ici.</p></div>
<div class="wrap" style="padding-bottom:72px">
<div class="wl-box"><h2>Être prévenu à la sortie</h2><form class="wl" data-wl novalidate><input type="email" name="email" placeholder="ton@email.fr" autocomplete="email" aria-label="Ton adresse e-mail" required><input class="hp" name="hp_url" tabindex="-1" autocomplete="off" aria-label="Ne pas remplir" aria-hidden="true"><button class="btn btn-primary" type="submit">Je veux être prévenu <span class="arr" aria-hidden="true">→</span></button></form>
<p class="wl-msg" role="status"></p><p class="wl-count" hidden></p>
<p class="wl-legal">Un seul e-mail, à la sortie de l'app. Rien d'autre. <a href="confidentialite.html">Confidentialité</a></p></div>
<form id="contact-form" novalidate>
  <label>Nom<input name="name" autocomplete="name" required></label>
  <label>E-mail<input name="email" type="email" autocomplete="email" required></label>
  <label>Sujet<select name="topic"><option>Être prévenu au départ de l'app</option><option>Devenir testeur</option><option>Une question</option><option>Une idée pour la route</option><option>Un souci à signaler</option></select></label>
  <label>Message<textarea name="message" required></textarea></label>
  <input class="hp" name="hp_url" tabindex="-1" autocomplete="off" aria-label="Ne pas remplir" aria-hidden="true">
  <button class="btn btn-primary" type="submit">Envoyer le message</button>
  <p class="form-msg" id="form-msg" role="status"></p>
</form></div>
</main>
