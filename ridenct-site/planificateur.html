<h1 class="sr-only">Planificateur d'itinéraire moto</h1>
<div class="planner" id="planner">
  <aside class="pl-panel" aria-label="Réglages de l'itinéraire">
    <div class="pl-top">
      <div class="pl-search">
        <input id="pl-q" type="search" placeholder="Adresse, ville, col, lieu…" autocomplete="off" aria-label="Rechercher un lieu">
        <button type="button" class="pl-ib" id="pl-me" aria-label="Ajouter ma position" title="Ma position"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></button>
        <div class="pl-sl" id="pl-sl" hidden></div>
      </div>
      <div class="pl-stats" id="pl-stats" aria-live="polite"></div>
    </div>
    <div class="pl-tabs" id="pl-tabs" role="tablist"></div>
    <div class="pl-body" id="pl-body"></div>
    <div class="pl-foot">
      <div class="pl-status" id="pl-status" role="status" hidden></div>
      <div class="pl-acts"><button type="button" class="btn btn-primary" id="pl-calc">Calculer</button></div>
    </div>
  </aside>
  <div class="pl-map"><div id="map" role="application" aria-label="Carte de l'itinéraire"></div><div class="pl-hint" id="pl-hint">Clique sur la carte pour placer ton départ</div></div>
</div>
