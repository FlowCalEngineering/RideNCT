<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Test voix</title>
<style>body{font:16px -apple-system,Helvetica,sans-serif;background:#111;color:#eee;margin:0;padding:16px}h1{font-size:18px}button,select{display:block;width:100%;margin:10px 0;padding:16px;border:0;border-radius:12px;background:#ff6a00;color:#fff;font-size:16px;font-weight:700}select{background:#2a2a2e}small{color:#aaa;display:block;margin:-4px 0 8px}pre{background:#000;padding:10px;border-radius:8px;font-size:12px;white-space:pre-wrap}progress{width:100%}</style></head><body>
<h1>Test voix naturelle (hors ligne)</h1>
<p>1. Choisis une voix, appuie sur <b>Télécharger</b> (une seule fois, patiente).<br>2. Lance ta musique externe.<br>3. Appuie sur <b>Dire</b> : note la qualité, le délai, et si la musique reprend.</p>
<select id="v"><option>Chargement des voix…</option></select>
<button id="dl" disabled>1. Télécharger la voix</button><progress id="pg" value="0" max="100"></progress>
<button id="s1" disabled>2. Dire : « Dans 300 mètres, tournez à droite »</button>
<button id="s2" disabled>3. Dire une phrase longue avec nom de rue</button>
<pre id="inf"></pre>
<script type="module">
const inf=document.getElementById('inf'),log=m=>inf.textContent+=m+'\n',$=id=>document.getElementById(id);
let tts;
try{tts=await import('https://cdn.jsdelivr.net/npm/@diffusionstudio/vits-web/+esm');log('moteur chargé')}catch(e){log('ERREUR chargement moteur : '+e.message)}
try{
  const vs=await tts.voices();const ids=Object.keys(vs).filter(k=>/^fr_/.test(k));
  $('v').innerHTML=ids.map(k=>{const q=vs[k];const sz=q&&q.files?Object.entries(q.files).filter(([f])=>/\.onnx$/.test(f)).map(([,x])=>x.size_bytes).join(''):'';return`<option value="${k}">${k}${sz?' ('+Math.round(sz/1e6)+' Mo)':''}</option>`}).join('');
  const pref=ids.find(k=>/siwis-low/.test(k))||ids.find(k=>/low/.test(k))||ids[0];if(pref)$('v').value=pref;
  $('dl').disabled=false;log('voix françaises : '+ids.join(', '));
  const st=await tts.stored();log('déjà téléchargées : '+(st.join(', ')||'aucune'));if(st.length){$('s1').disabled=$('s2').disabled=false}
}catch(e){log('ERREUR liste des voix : '+e.message)}
$('dl').onclick=async()=>{const id=$('v').value;log('téléchargement '+id+'…');const t=Date.now();
  try{await tts.download(id,p=>{if(p.total)$('pg').value=Math.round(p.loaded*100/p.total)});log('téléchargé en '+Math.round((Date.now()-t)/1000)+' s');$('s1').disabled=$('s2').disabled=false}catch(e){log('ERREUR téléchargement : '+e.message)}};
const au=new Audio();au.setAttribute('playsinline','');
async function say(txt){const id=$('v').value;try{navigator.audioSession.type='transient'}catch(e){}
  const t=Date.now();log('synthèse…');
  try{const wav=await tts.predict({text:txt,voiceId:id});log('synthèse : '+(Date.now()-t)+' ms');au.src=URL.createObjectURL(wav);await au.play();log('lecture')}catch(e){log('ERREUR : '+e.message)}}
$('s1').onclick=()=>say('Dans trois cents mètres, tournez à droite.');
$('s2').onclick=()=>say('Dans cinq cents mètres, prenez la deuxième sortie du rond-point, direction Rochefort-en-Terre.');
</script></body></html>
